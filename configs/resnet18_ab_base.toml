# configs/resnet18_ab_base.toml —— 预训练 A/B 第二期（归一化+BN 修复后复验）从零臂
# coco8 检测 120ep：resnet18 从零（ImageNet 无预训练），输入保持 [0,1] RGB
# （imagenet_norm = false）。与 resnet18_ab_pretrain.toml 除 backbone.imagenet_norm
# 与 [pretrain] 外逐字段一致。对照第一期矩阵臂（detect_coco8_matrix_arm2），
# 本期验证两项修复：① ImageNet mean/std 归一化消除 BN 域失配（根因 #3）；
# ② 引擎 BN train/eval 装配开关接线（训练态批统计 + running 更新）。
run_id = "resnet18-ab-base"
seed = 3
device = "cpu"
output_dir = "runs"

[model]
backbone = { family = "resnet18", depth = 1.0, width = 1.0, pretrained = "none", imagenet_norm = false }
neck = { type = "identity", channels = [] }

[[model.tasks]]
kind = "detect"
head = "yolo"
loss_weight = 1.0
assigner = "tal"
obb_mode = false
num_classes = 80
img_size = 320

[data]
pipeline = "dir"
workers = 1
prefetch = 1

[data.sources.train]
dir = "data/coco8"
[[data.sources.train.tasks]]
kind = "detect"
format = "yolo"

[data.sources.val]
dir = "data/coco8"

[train]
epochs = 120
batch_size = 4
optimizer = { type = "adamw", lr = 1e-3, weight_decay = 1e-4 }
warmup_epochs = 5
scheduler = { type = "cosine", lr_min_factor = 0.01 }
amp = false
deterministic = false
ema_decay = 0.999
grad_clip = 10.0

[eval]
interval_epochs = 20
protocols = ["mean_iou", "recall@0.5"]

[panel]
enabled = false
port = 8080
