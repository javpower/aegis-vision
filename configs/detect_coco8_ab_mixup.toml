# configs/detect_coco8_ab_mixup.toml —— 数据增强 A/B 检测 +mosaic+mixup 臂（数据增强官二波）
# 与 +mosaic 臂（configs/detect_coco8_ab_mosaic.toml）唯一差异：追加 mixup = 0.2
# （双样本 Beta(0.2, 0.2) 加权融合，框/类别取并集，YOLO 惯例）。
# A/B 结论见 docs/USAGE.md「数据增强 A/B」。
run_id = "detect-coco8-ab-mixup"
seed = 3
device = "cpu"
output_dir = "runs-aug2"

[model]
backbone = { family = "simple-cnn", depth = 1.0, width = 1.0, pretrained = "none" }
neck = { type = "identity", channels = [] }

[[model.tasks]]
kind = "detect"
head = "yolo"
loss_weight = 1.0
assigner = "tal"
obb_mode = false
num_classes = 80
img_size = 320

[data]
pipeline = "dir"
workers = 1
prefetch = 1

[data.sources.train]
dir = "data/coco8"
[[data.sources.train.tasks]]
kind = "detect"
format = "yolo"

[data.sources.train.tasks.augment]
mosaic = 1.0
mixup = 0.2
flip = 0.5
hsv = [0.1, 0.1, 0.1]
scale_jitter = [0.9, 1.1]
close_last_epochs = 40

[data.sources.val]
dir = "data/coco8"

[train]
epochs = 400
batch_size = 4
optimizer = { type = "adamw", lr = 1e-3, weight_decay = 1e-4 }
warmup_epochs = 10
scheduler = { type = "cosine", lr_min_factor = 0.01 }
amp = false
deterministic = false
ema_decay = 0.999
grad_clip = 10.0

[eval]
interval_epochs = 10
protocols = ["mean_iou", "recall@0.5"]

[panel]
enabled = false
port = 8080
