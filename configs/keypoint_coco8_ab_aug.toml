# configs/keypoint_coco8_ab_aug.toml —— 数据增强 A/B 增强臂
# 与基线臂（keypoint_coco8_ab_base.toml）唯一差异：训练源任务挂 augment
# （水平翻转 p=0.5 + HSV 通道抖动 ±0.1 + 尺度抖动 [0.9,1.1]，
#   最后 20 epoch 自动关强增强收尾）。val / 评测路径永不增强。
# A/B 结论见 BENCHMARK.md「数据增强 A/B」。
run_id = "keypoint-coco8-ab-aug"
seed = 7
device = "cpu"
output_dir = "runs"

[model]
backbone = { family = "simple-cnn", depth = 1.0, width = 1.0, pretrained = "none" }
neck = { type = "identity", channels = [] }

[[model.tasks]]
kind = "keypoint"
decode = "direct"
loss_weight = 1.0
num_keypoints = 17
img_size = 320
loss_oks_weight = 1.0

[data]
pipeline = "dir"
workers = 1
prefetch = 1

[data.sources.train]
dir = "data/coco8-pose"
[[data.sources.train.tasks]]
kind = "keypoint"
format = "coco_pose"

[data.sources.train.tasks.augment]
flip = 0.5                         # 水平翻转概率（COCO 17 点左右索引同步交换）
hsv = [0.1, 0.1, 0.1]              # R/G/B 通道乘性抖动幅度（HSV 简化版，见 av-tasks::augment）
scale_jitter = [0.9, 1.1]          # 每样本随机缩放系数范围
close_last_epochs = 20             # 最后 20 epoch 关强增强（干净分布收尾）

[data.sources.val]
dir = "data/coco8-pose"

[train]
epochs = 200
batch_size = 4
optimizer = { type = "adamw", lr = 1e-3, weight_decay = 1e-4 }
warmup_epochs = 10
scheduler = { type = "cosine", lr_min_factor = 0.01 }
amp = false
deterministic = false
ema_decay = 0.999
grad_clip = 10.0

[eval]
interval_epochs = 10
protocols = ["pck@0.5", "oks"]

[panel]
enabled = false
port = 8080
