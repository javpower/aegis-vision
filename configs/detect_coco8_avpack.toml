# configs/detect_coco8_avpack.toml —— 真实数据（Ultralytics coco8）.avpack 容器端到端
# 打包：av pack --src data/coco8 --out data/coco8.avpack（18 文件，blake3 校验）
# 用法：av train -c configs/detect_coco8_avpack.toml
run_id = "detect-coco8-avpack"
seed = 3
device = "cuda:0"                  # 无 CUDA 自动回退 CPU
output_dir = "runs"

[model]
backbone = { family = "simple-cnn", depth = 1.0, width = 1.0, pretrained = "none" }
neck = { type = "identity", channels = [] }

[[model.tasks]]
kind = "detect"
head = "yolo"
loss_weight = 1.0
assigner = "tal"
obb_mode = false
num_classes = 80                   # COCO 80 类（coco8 标注沿用原类 id）
img_size = 320

[data]
pipeline = "avpack"                # .avpack 单文件容器数据源（PLAN 附录 B）
workers = 1
prefetch = 1

[data.sources.train]
avpack = "data/coco8.avpack"       # 容器名约定 = 打包时相对路径（images/<split>/...）
[[data.sources.train.tasks]]
kind = "detect"
format = "yolo"

[data.sources.val]                 # 缺省使用同一容器的 val split
avpack = "data/coco8.avpack"

[train]
epochs = 400
batch_size = 4
optimizer = { type = "adamw", lr = 1e-3, weight_decay = 1e-4 }
warmup_epochs = 10
scheduler = { type = "cosine", lr_min_factor = 0.01 }
amp = false
deterministic = false
ema_decay = 0.999
grad_clip = 10.0

[eval]
interval_epochs = 10
protocols = ["mean_iou", "recall@0.5"]

[panel]
enabled = false
port = 8080
