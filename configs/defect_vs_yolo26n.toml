# configs/defect_vs_yolo26n.toml —— 缺陷检测（OK/NG 二类）vs YOLO26n 基准 · 冠军配方（v14）
#
# 数据：E:/xunlian/datasets/defect（YOLO 格式 2 类，train 322 / val 80，
# 5472×3648 工业大图；目标为 ~60×69px 小方块（原图），1280 下 ~14×16px，
# 约 7 框/图，OK 597 / NG 1659 框）。
#
# 基准：E:/xunlian/runs/yolo26n_defect（ultralytics yolo26n，imgsz 1280 /
# batch 16 / 100 epoch / COCO 预训练，best@ep50：mAP50=0.995, mAP50:95=0.720,
# P=0.9996, R=1.000，8.6 秒/epoch）。
# 本配方 best@ep144（runs/defect-vs-yolo26n-v14，配融合 NMS 评测）：
# mAP50=0.988, mAP50:95=0.698, P=0.980, R=0.996，~8 秒/epoch。
# 差距从代码优化前的 -5.4/-6.6 点缩到 -0.7/-2.2 点。
#
# 配方要点（v4→v18 十四轮实验 + 代码级优化结论）：
# 1. mosaic 必须关：拼贴把小目标缩半到 ~7px，模型完全学不动（mAP 长期为 0）；
#    去掉 mosaic 后增强全程可学。scale_jitter 直接作用于原尺寸，[0.7, 1.3]。
# 2. batch=8：batch 16 触发 CPU 堆膨胀 OOM（与 mosaic 无关，encode 变尺寸
#    缓冲随 batch 线性放大）；accumulate_steps=2（等效 16）在固定轮数下
#    优化步减半，实测 -0.5/-1.3，勿用。
# 3. 150 epoch 比 100 再 +1.5 点 mAP50；close_last 15→40 实测 -0.7/-1.9
#    （增强学习段被压缩，小目标鲁棒性受损）——15 是甜点。
# 4. 已试且无益的配置项：损失权重改基准的 cls=0.5/ciou=7.5（-7.3/-6.1）；
#    imgsz 1536（-2.6/-1.6）；depth 1.0 参数翻倍（-2.4/-0.9）。
# 5. 代码级优化（本仓库已落地）：
#    - NMS 类感知 + 分数加权融合（av-core types::nms）：仅同类互相抑制
#      （Ultralytics max_wh 偏移等价），被抑制框按分数加权融进保留框——
#      相邻 OK/NG 不互杀 + 小目标重复预测合并且框更紧，合计 +1.6/+2.7 点；
#    - TAL norm_align_metric parity（assigner）：权重 = (t × IoU) / max(t×IoU)，
#      候选自身 IoU 二次计入（此前少乘一次）；本数据集 ±0.3 中性，语义对齐保留；
#    - 评测补齐 Ultralytics parity 的 P/R（eval_map 逐类 max-F1 点）。
# 6. 已试且回退的代码改动：检测框回归 LTRB 距离 DFL（v8 式）——同种子受控
#    对照 -1.2/-3.8（log-size 尺度不变性对小目标更有利），已回滚。
# 7. TAL 分配跨层全局竞争（超参 topk=10/α=0.5/β=6.0 与 Ultralytics 对齐），
#    P2 头对 14px 小目标无增益空间（跨层分配已覆盖）。
#
# 用法：av-runtime train -c configs/defect_vs_yolo26n.toml
run_id = "defect-vs-yolo26n-v14"
seed = 42
device = "cuda:0"                  # 无 CUDA 自动回退 CPU
output_dir = "runs"

[model.backbone]
family = "csp-elan"                # YOLOv8 同构骨干（nano 形状 0.25/0.33）
depth = 0.33
width = 0.25
pretrained = "none"
imagenet_norm = false

[model.neck]
type = "identity"
channels = []

[[model.tasks]]
kind = "detect"
head = "yolo"
loss_weight = 1.0
assigner = "tal"
obb_mode = false
num_classes = 2
img_size = 1280
loss_cls_weight = 1.0
loss_ciou_weight = 5.0
loss_dfl_weight = 1.5
head_levels = [8, 16]

[data]
pipeline = "dir"
workers = 1
prefetch = 1

[data.sources.train]
dir = "E:/xunlian/datasets/defect"
split = "train"

[[data.sources.train.tasks]]
kind = "detect"
format = "yolo"

[data.sources.train.tasks.augment]
mosaic = 0.0                       # 关键：小目标经 mosaic 缩半即不可学
mixup = 0.0
flip = 0.5
hsv = [0.015, 0.7, 0.4]
scale_jitter = [0.7, 1.3]
close_last_epochs = 15             # 尾段清洁退火

[data.sources.val]
dir = "E:/xunlian/datasets/defect"
split = "val"

[train]
epochs = 150
batch_size = 8                     # 16 触发堆膨胀 OOM，实测 8 稳定
optimizer = { type = "adamw", lr = 1e-3, weight_decay = 1e-4 }
warmup_epochs = 3
scheduler = { type = "cosine", lr_min_factor = 0.01 }
amp = true
deterministic = false
ema_decay = 0.999
grad_clip = 10.0

[eval]
interval_epochs = 1                # 逐 epoch 验证，best 按 fitness 选点
protocols = ["coco-map"]

[pretrain]
enable = true
weight_path = "data/pretrain/yolov8n_backbone_full.safetensors"   # 官方 yolov8n 完整骨干（COCO 预训练）
layer_map = "configs/cspelan_yolov8n_map.toml"
load_only_backbone = true
freeze_backbone = false

[panel]
enabled = false
port = 8080
