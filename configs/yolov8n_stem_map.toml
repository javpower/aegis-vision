# yolov8n 骨干 stem conv → AV simple-cnn 骨干层映射（[[entries]] from/to/transpose）
# 形状同构前提：backbone width = 1.0（c1/c2/c3 = 16/32/64 通道，恰为 yolov8n
# stem model.0/1/3 的输出宽度）；model.2 为 C2f 模块，无对应目标，走 unexpected。
# yolov8n conv 无 bias，c1-c3 的 bias 保持初始化；BN 参数/统计量无目标，unexpected。

[[entries]]
from = '^model\.0\.conv\.'
to = 'backbone.c1.'
transpose = false

[[entries]]
from = '^model\.1\.conv\.'
to = 'backbone.c2.'
transpose = false

[[entries]]
from = '^model\.3\.conv\.'
to = 'backbone.c3.'
transpose = false
