# configs/resnet18_ab_pretrain.toml —— 预训练 A/B 第二期（归一化+BN 修复后复验）预训练臂
# coco8 检测 120ep：resnet18 + ImageNet 预训练（[pretrain] 官方通道 100/100 全量导入），
# 输入做 ImageNet mean/std 归一化（imagenet_norm = true，与预训练 BN running 统计量
# 同域——第一期根因 #3 的修复），BN 训练态正常开放（freeze_backbone = false → 引擎
# 每 epoch set_train(true)，批统计 + running 更新；评测前 set_train(false)）。
# 与 resnet18_ab_base.toml 除 backbone.imagenet_norm 与 [pretrain] 外逐字段一致。
# 权重导出：python tools/export/export_resnet18.py --dst data/pretrain/resnet18_imagenet.safetensors
run_id = "resnet18-ab-pretrain"
seed = 3
device = "cpu"
output_dir = "runs"

[model]
backbone = { family = "resnet18", depth = 1.0, width = 1.0, pretrained = "none", imagenet_norm = true }
neck = { type = "identity", channels = [] }

[[model.tasks]]
kind = "detect"
head = "yolo"
loss_weight = 1.0
assigner = "tal"
obb_mode = false
num_classes = 80
img_size = 320

[data]
pipeline = "dir"
workers = 1
prefetch = 1

[data.sources.train]
dir = "data/coco8"
[[data.sources.train.tasks]]
kind = "detect"
format = "yolo"

[data.sources.val]
dir = "data/coco8"

[train]
epochs = 120
batch_size = 4
optimizer = { type = "adamw", lr = 1e-3, weight_decay = 1e-4 }
warmup_epochs = 5
scheduler = { type = "cosine", lr_min_factor = 0.01 }
amp = false
deterministic = false
ema_decay = 0.999
grad_clip = 10.0

[eval]
interval_epochs = 20
protocols = ["mean_iou", "recall@0.5"]

[panel]
enabled = false
port = 8080

# ---- 预训练权重导入（torchvision ResNet18 ImageNet，本臂的核心差异）----
[pretrain]
enable = true
weight_path = "data/pretrain/resnet18_imagenet.safetensors"
load_only_backbone = true          # 只匹配名字含 "backbone" 的目标变量（头按任务重训）
freeze_backbone = false            # 骨干可训 + BN 训练态开放（running 统计量随目标域重估）
layer_map = "configs/resnet18_map.toml"   # torchvision 名 → backbone. 前缀（一条映射）
